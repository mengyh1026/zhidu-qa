<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>境外财务管理操作指南 · 智能问答</title>
<style>
  :root {
    --primary: #1a5fb4;
    --primary-dark: #124a8f;
    --primary-light: #e8f0fb;
    --accent: #e8a33d;
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1f2937;
    --text-sub: #6b7280;
    --border: #e5e7eb;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    flex-shrink: 0;
  }
  header .logo {
    width: 40px; height: 40px;
    background: rgba(255,255,255,.15);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  header .title { font-size: 17px; font-weight: 600; }
  header .subtitle { font-size: 12px; opacity: .85; margin-top: 2px; }
  header .badge {
    margin-left: auto;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.3);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 0;
  }
  .container { max-width: 860px; margin: 0 auto; padding: 0 20px; }
  .welcome { text-align: center; padding: 30px 0 10px; }
  .welcome h2 { font-size: 22px; color: var(--primary-dark); margin-bottom: 8px; }
  .welcome p { color: var(--text-sub); font-size: 14px; margin-bottom: 20px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 24px; }
  .chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    transition: all .2s;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
  .msg { display: flex; gap: 12px; margin-bottom: 18px; }
  .msg .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: var(--primary-light); }
  .msg.bot .avatar { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; }
  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.7;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .msg.user .bubble { background: var(--primary); color: #fff; border-top-right-radius: 4px; }
  .msg.bot .bubble { background: var(--card); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .bubble p { margin-bottom: 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 6px 0 8px 20px; }
  .bubble h1, .bubble h2, .bubble h3 { margin: 10px 0 6px; font-size: 15px; }
  .bubble code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .bubble table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 13px; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
  .bubble th { background: var(--primary-light); }
  .source {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    font-size: 12px;
    color: var(--text-sub);
  }
  .source .tag {
    display: inline-block;
    background: var(--primary-light);
    color: var(--primary-dark);
    border-radius: 4px;
    padding: 2px 8px;
    margin: 2px 4px 2px 0;
    font-size: 11px;
  }
  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing span { width: 6px; height: 6px; background: var(--text-sub); border-radius: 50%; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }
  .notice {
    background: #fff7ed;
    border: 1px solid #fed7aa;
    color: #9a3412;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
    margin: 8px 0;
  }
  footer {
    flex-shrink: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 12px 20px 16px;
  }
  .inputbar {
    max-width: 860px; margin: 0 auto;
    display: flex; gap: 10px; align-items: flex-end;
  }
  textarea {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 48px;
    max-height: 140px;
    line-height: 1.5;
    transition: border-color .2s;
  }
  textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,95,180,.12); }
  .sendbtn {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 12px 22px;
    font-size: 14px;
    cursor: pointer;
    transition: background .2s;
    flex-shrink: 0;
  }
  .sendbtn:hover { background: var(--primary-dark); }
  .sendbtn:disabled { background: #9ca3af; cursor: not-allowed; }
  .hint { text-align: center; color: var(--text-sub); font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <div class="logo">📘</div>
  <div>
    <div class="title">境外财务管理操作指南 · 智能问答</div>
    <div class="subtitle">中国海诚工程科技股份有限公司 · 财务资金管理中心</div>
  </div>
  <div class="badge">阿联酋 · 摩洛哥</div>
</header>

<main id="main">
  <div class="container">
    <div class="welcome" id="welcome">
      <h2>👋 您好，我是境外财务管理小助手</h2>
      <p>基于《中国海诚境外财务管理操作指南》（阿联酋、摩洛哥）智能问答，可查询税收制度、外汇资金、项目全周期财务管理等内容</p>
      <div class="chips" id="chips">
        <div class="chip">阿联酋企业所得税税率是多少？</div>
        <div class="chip">摩洛哥资金汇出需要什么材料？</div>
        <div class="chip">境外项目投标阶段要注意什么？</div>
        <div class="chip">常设机构（PE）如何认定？</div>
        <div class="chip">阿联酋增值税申报周期？</div>
        <div class="chip">境外项目有哪些汇率风险？</div>
      </div>
    </div>
    <div id="chat"></div>
  </div>
</main>

<footer>
  <div class="inputbar">
    <textarea id="input" placeholder="请输入您的问题，例如：阿联酋项目资金出境要什么材料？" rows="1"></textarea>
    <button class="sendbtn" id="send">发送</button>
  </div>
  <div class="hint">回答由 AI 生成，仅供参考，请以正式制度文件为准 · 支持检索式/生成式双模式</div>
</footer>

<script src="data.js"></script>
<script>
// ============ 配置 ============
// 生成式后端代理地址（部署 Serverless 后填入，如 https://xxx.fc.aliyuncs.com/chat）
// 留空则自动使用检索式模式
// 部署到线上后，填入云端代理地址即可启用生成式问答（如 https://xxx.fc.aliyuncs.com/chat）
// 留空则使用检索模式：直接展示命中的制度条文原文
const PROXY_URL = "https://1476023346-4nnqmdmu53.ap-guangzhou.tencentscf.com";

// ============ 检索（BM25） ============
const INDEX = window.ZHIDU_INDEX || [];

function tokenize(text) {
  const tokens = [];
  const cjk = text.match(/[\u4e00-\u9fa5]+/g) || [];
  for (const seg of cjk) {
    if (seg.length === 1) tokens.push(seg);
    else for (let i = 0; i < seg.length - 1; i++) tokens.push(seg.slice(i, i + 2));
  }
  const words = text.match(/[a-zA-Z0-9]+/g) || [];
  for (const w of words) tokens.push(w.toLowerCase());
  return tokens;
}

// 预计算
const docTokens = INDEX.map(d => tokenize(d.t));
const N = docTokens.length;
const df = {};
docTokens.forEach(toks => {
  const uniq = new Set(toks);
  uniq.forEach(t => { df[t] = (df[t] || 0) + 1; });
});
const avgdl = docTokens.reduce((s, t) => s + t.length, 0) / N;

function bm25Score(queryTokens, docToks) {
  const dl = docToks.length;
  const k1 = 1.5, b = 0.75;
  let score = 0;
  const qSet = new Set(queryTokens);
  for (const term of qSet) {
    const tf = docToks.filter(t => t === term).length;
    if (tf === 0) continue;
    const idf = Math.log(1 + (N - (df[term] || 0) + 0.5) / ((df[term] || 0) + 0.5));
    score += idf * (tf * (k1 + 1)) / (tf + k1 * (1 - b + b * dl / avgdl));
  }
  return score;
}

function search(query, topK = 5) {
  const qt = tokenize(query);
  if (qt.length === 0) return [];
  const scored = docTokens.map((toks, i) => ({ idx: i, score: bm25Score(qt, toks) }));
  scored.sort((a, b) => b.score - a.score);
  return scored.filter(s => s.score > 0).slice(0, topK).map(s => INDEX[s.idx]);
}

// ============ Markdown 轻渲染 ============
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function renderMarkdown(text) {
  let lines = escapeHtml(text).split("\n");
  let html = "";
  let inList = false, inTable = false;
  const closeList = () => { if (inList) { html += "</ul>"; inList = false; } };
  const closeTable = () => { if (inTable) { html += "</table>"; inTable = false; } };
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { closeList(); closeTable(); continue; }
    if (/^\|.*\|$/.test(line)) {
      closeList();
      const cells = line.split("|").slice(1, -1).map(c => c.trim());
      if (!inTable) { html += "<table>"; inTable = true; }
      if (/^[-: ]+$/.test(cells.join(""))) continue;
      const tag = inTable && !html.includes("<tr>") ? "th" : "td";
      html += "<tr>" + cells.map(c => `<${tag}>${c}</${tag}>`).join("") + "</tr>";
      continue;
    }
    closeTable();
    if (/^[-*]\s+/.test(line)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + line.replace(/^[-*]\s+/, "") + "</li>";
      continue;
    }
    closeList();
    if (/^#{1,3}\s+/.test(line)) {
      const lvl = line.match(/^#+/)[0].length;
      html += `<h${lvl}>` + line.replace(/^#+\s+/, "") + `</h${lvl}>`;
    } else {
      html += "<p>" + line + "</p>";
    }
  }
  closeList(); closeTable();
  return html;
}

// ============ 聊天 UI ============
const chatEl = document.getElementById("chat");
const welcomeEl = document.getElementById("welcome");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");

function addMsg(role, contentHtml) {
  welcomeEl.style.display = "none";
  const div = document.createElement("div");
  div.className = "msg " + role;
  const avatar = role === "user" ? "🙋" : "🤖";
  div.innerHTML = `<div class="avatar">${avatar}</div><div class="bubble">${contentHtml}</div>`;
  chatEl.appendChild(div);
  scrollBottom();
  return div;
}
function scrollBottom() {
  const main = document.getElementById("main");
  main.scrollTop = main.scrollHeight;
}
function showTyping() {
  const div = document.createElement("div");
  div.className = "msg bot";
  div.id = "typing";
  div.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatEl.appendChild(div);
  scrollBottom();
  return div;
}
function removeTyping() {
  const t = document.getElementById("typing");
  if (t) t.remove();
}

function sourceHtml(results) {
  if (!results || results.length === 0) return "";
  const tags = results.map(r => `<span class="tag">${r.c} · ${r.s}</span>`).join("");
  return `<div class="source">📎 参考来源：${tags}</div>`;
}

// ============ 问答主流程 ============
async function ask(question) {
  const q = question.trim();
  if (!q) return;
  addMsg("user", `<p>${escapeHtml(q)}</p>`);
  inputEl.value = "";
  inputEl.disabled = true; sendBtn.disabled = true;
  showTyping();

  const results = search(q, 5);
  const context = results.map(r => ({ section: r.s, text: r.t }));

  let answer = null;
  let usedProxy = false;
  if (PROXY_URL) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 30000);
      const resp = await fetch(PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q, context }),
        signal: ctrl.signal
      });
      clearTimeout(timer);
      if (resp.ok) {
        const data = await resp.json();
        if (data.answer) { answer = data.answer; usedProxy = true; }
      }
    } catch (e) {
      console.warn("代理调用失败，降级为检索模式", e);
    }
  }

  removeTyping();
  if (answer) {
    addMsg("bot", renderMarkdown(answer) + sourceHtml(results));
  } else {
    // 检索式降级
    let html = "";
    if (results.length > 0) {
      html = `<p>当前为<b>检索模式</b>（生成式服务未配置或不可用），为您找到以下相关条文：</p>`;
      results.forEach(r => {
        html += `<div class="source" style="margin-top:6px"><span class="tag">${r.c} · ${r.s}</span></div>`;
        html += `<p style="font-size:13px;color:#374151">${escapeHtml(r.t.slice(0, 300))}${r.t.length > 300 ? "…" : ""}</p>`;
      });
    } else {
      html = `<p>抱歉，未在指南中找到相关内容。请尝试换个问法，或补充国别（阿联酋/摩洛哥）与关键词。</p>`;
    }
    addMsg("bot", html);
  }
  inputEl.disabled = false; sendBtn.disabled = false;
  inputEl.focus();
}

// ============ 事件 ============
sendBtn.addEventListener("click", () => ask(inputEl.value));
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(inputEl.value); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
});
document.getElementById("chips").addEventListener("click", e => {
  if (e.target.classList.contains("chip")) ask(e.target.textContent);
});
</script>
</body>
</html>
