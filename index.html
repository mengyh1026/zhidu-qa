<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
  :root {
    --primary: #5b8db8;
    --primary-dark: #4a7ca8;
    --primary-light: #edf3f8;
    --accent: #8fb5ae;
    --bg: #f7f9fb;
    --card: #ffffff;
    --text: #1f2937;
    --text-sub: #6b7280;
    --border: #e5e7eb;

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #f0f5f9 0%, #f7f9fb 40%, #f2f7f4 100%);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  @media (max-width: 640px) {
    header { padding: 10px 14px; gap: 10px; }
    header .logo { width: 34px; height: 34px; font-size: 17px; }
    header .logo img { width: 30px; height: 30px; }
    header .title { font-size: 15px; }
    header .subtitle { font-size: 11px; }
    .container { padding: 0 12px; }
    .welcome h2 { font-size: 19px; }
    .welcome p { font-size: 14px; }

    .bubble { max-width: 86%; font-size: 15px; padding: 10px 13px; }
    .msg .avatar { width: 30px; height: 30px; font-size: 14px; }

    textarea { padding: 10px 12px; min-height: 44px; }

  header {
    background: linear-gradient(135deg, #7ea6c6 0%, #5b8db8 55%, #4a7ca8 100%);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);

  header .logo {
    width: 40px; height: 40px;
    background: #fff;

  .cbtn {

    border: 1px solid var(--border);

  .bubble {
    max-width: 78%;

    background: #fdf6ec;

  .inputbar {

  .src-detail {

  .taglink { cursor: pointer; }

  .followups { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .fu-label { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
  .fuchip { display: inline-block; margin: 0 6px 6px 0; font-size: 13px; padding: 5px 12px; }
  .keycard {

  .fbtn.on { color: var(--primary-dark); font-weight: 600; }
</style>

<body>
<header>
  <div class="logo"><img src="logo.png" alt="中国海诚"></div>
  <div>
    <div class="title">境外财务管理操作指南 · 智能问答</div>
    <div class="subtitle">中国海诚工程科技股份有限公司 · 财务资金管理中心</div>
  </div>
  <div class="badge" id="clearBtn" title="清空对话">🗑 清空</div>
</header>

<main id="main">
  <div class="countrybar" id="countrybar">
    <span class="clabel">范围：</span>
    <button class="cbtn active" data-c="全部">全部</button>
    <button class="cbtn" data-c="阿联酋"><img src="ae.svg" class="flag" alt="阿联酋">阿联酋</button>
    <button class="cbtn" data-c="摩洛哥"><img src="ma.svg" class="flag" alt="摩洛哥">摩洛哥</button>
  </div>

  <div class="container">
    <div class="welcome" id="welcome">
      <h2>👋 您好，我是境外财务管理小助手</h2>
      <p>基于《中国海诚境外财务管理操作指南》（阿联酋、摩洛哥）智能问答，可查询税收制度、外汇资金、项目全周期财务管理等内容</p>
      <div class="chips" id="chips">
        <div class="chip">阿联酋企业所得税税率是多少？</div>
        <div class="chip">摩洛哥资金汇出需要什么材料？</div>
        <div class="chip">境外项目投标阶段要注意什么？</div>
        <div class="chip">常设机构（PE）如何认定？</div>
        <div class="chip">阿联酋增值税申报周期？</div>
        <div class="chip">境外项目有哪些汇率风险？</div>
      </div>
    </div>
    <div id="chat"></div>
  </div>
</main>

<footer>
  <div class="inputbar">
    <textarea id="input" placeholder="请输入您的问题，例如：阿联酋项目资金出境要什么材料？" rows="1"></textarea>
    <button class="sendbtn" id="send">发送</button>
  </div>
  <div class="hint">回答由 AI 生成，仅供参考，请以正式制度文件为准 · 支持检索式/生成式双模式</div>
</footer>

<script src="data.js"></script>
<script>
// ============ 配置 ============
// 生成式后端代理地址（部署 Serverless 后填入，如 https://xxx.fc.aliyuncs.com/chat）
// 留空则自动使用检索式模式
// 部署到线上后，填入云端代理地址即可启用生成式问答（如 https://xxx.fc.aliyuncs.com/chat）
// 留空则使用检索模式：直接展示命中的制度条文原文
const PROXY_URL = "https://1476023346-4nnqmdmu53.ap-guangzhou.tencentscf.com";

// ============ 对话历史（供多轮追问） ============
let HISTORY = []; // {q, a}

// ============ 检索（BM25） ============
const INDEX = window.ZHIDU_INDEX || [];

function tokenize(text) {
  const tokens = [];
  const cjk = text.match(/[\u4e00-\u9fa5]+/g) || [];
  for (const seg of cjk) {
    if (seg.length === 1) tokens.push(seg);
    else for (let i = 0; i < seg.length - 1; i++) tokens.push(seg.slice(i, i + 2));
  }
  const words = text.match(/[a-zA-Z0-9]+/g) || [];
  for (const w of words) tokens.push(w.toLowerCase());
  return tokens;
}

// 预计算
const docTokens = INDEX.map(d => tokenize(d.t));
const N = docTokens.length;
const df = {};
docTokens.forEach(toks => {
  const uniq = new Set(toks);
  uniq.forEach(t => { df[t] = (df[t] || 0) + 1; });
});
const avgdl = docTokens.reduce((s, t) => s + t.length, 0) / N;

function bm25Score(queryTokens, docToks) {
  const dl = docToks.length;
  const k1 = 1.5, b = 0.75;
  let score = 0;
  const qSet = new Set(queryTokens);
  for (const term of qSet) {
    const tf = docToks.filter(t => t === term).length;
    if (tf === 0) continue;
    const idf = Math.log(1 + (N - (df[term] || 0) + 0.5) / ((df[term] || 0) + 0.5));
    score += idf * (tf * (k1 + 1)) / (tf + k1 * (1 - b + b * dl / avgdl));
  }
  return score;
}

function search(query, topK = 5) {
  const qt = tokenize(query);
  if (qt.length === 0) return [];
  const scored = docTokens.map((toks, i) => ({ idx: i, score: bm25Score(qt, toks) }));
  scored.sort((a, b) => b.score - a.score);
  return scored.filter(s => s.score > 0).slice(0, topK).map(s => INDEX[s.idx]);
}

// ============ Markdown 轻渲染 ============
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function renderMarkdown(text) {
  const lines = escapeHtml(text).replace(/\[(\d{1,2})\]/g, '<sup class="cite">$1</sup>').split("\n");
  let html = "";
  let inList = false, inTable = false;
  const closeList = () => { if (inList) { html += "</ul>"; inList = false; } };
  const closeTable = () => { if (inTable) { html += "</table>"; inTable = false; } };
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { closeList(); closeTable(); continue; }
    if (/^\|.*\|$/.test(line)) {
      closeList();
      const cells = line.split("|").slice(1, -1).map(c => c.trim());
      if (!inTable) { html += "<table>"; inTable = true; }
      if (/^[-: ]+$/.test(cells.join(""))) continue;
      const tag = inTable && !html.includes("<tr>") ? "th" : "td";
      html += "<tr>" + cells.map(c => `<${tag}>${c}</${tag}>`).join("") + "</tr>";
      continue;
    }
    closeTable();
    if (/^[-*]\s+/.test(line)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + line.replace(/^[-*]\s+/, "") + "</li>";
      continue;
    }
    closeList();
    if (/^#{1,3}\s+/.test(line)) {
      const lvl = line.match(/^#+/)[0].length;
      html += `<h${lvl}>` + line.replace(/^#+\s+/, "") + `</h${lvl}>`;
    } else {
      html += "<p>" + line + "</p>";
    }
  }
  closeList(); closeTable();
  return html;
}

// ============ 回答解析：要点卡 + 追问 ============
function extractKeycard(answer) {
  // 按「要点：」行截取其后的连续区块（直到空行或文本真正结尾），避免 multiline $ 在首个行尾提前截断
  const m = answer.match(/^[ \t]*(?:【要点】|要点[:：])[ \t]*\n?([\s\S]*?)\n[ \t]*\n|^[ \t]*(?:【要点】|要点[:：])[ \t]*\n?([\s\S]+)$/);
  const seg = (m && (m[1] !== undefined ? m[1] : m[2])) || "";
  if (!m) return null;
  const items = seg.split("\n").map(s => s.replace(/^[\s\-\*\d.、]+/, "").trim()).filter(s => s.length >= 2).slice(0, 5);
  return items.length ? items : null;
}
function parseAnswer(answer) {
  const parsed = splitFollowups(answer);
  let body = parsed.body;
  const keyItems = extractKeycard(body);
  if (keyItems) body = body.replace(/^\s*(?:【要点】|要点[:：])\s*[\s\S]*?(?:\n\s*\n|$)/m, "").trim();
  return { body, keyItems, followups: parsed.followups };
}
function keycardHtml(items) {
  if (!items || !items.length) return "";
  return `<div class="keycard"><div class="kc-title">⚡ 要点速览</div><ul>` +
    items.map(i => `<li>${i}</li>`).join("") + `</ul></div>`;
}

// ============ 国别筛选 ============
let CURRENT_COUNTRY = "全部";
document.getElementById("countrybar").addEventListener("click", e => {
  const btn = e.target.closest(".cbtn");
  if (!btn) return;
  CURRENT_COUNTRY = btn.dataset.c;
  document.querySelectorAll(".cbtn").forEach(b => b.classList.toggle("active", b === btn));
});

// ============ 清空对话 ============
document.getElementById("clearBtn").addEventListener("click", () => {
  if (chatEl.children.length === 0) return;
  if (!confirm("确定清空当前对话吗？")) return;
  chatEl.innerHTML = "";
  HISTORY = [];
  welcomeEl.style.display = "";
  inputEl.focus();
});

// ============ 聊天 UI ============
const chatEl = document.getElementById("chat");
const welcomeEl = document.getElementById("welcome");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");

function addMsg(role, contentHtml) {
  welcomeEl.style.display = "none";
  const div = document.createElement("div");
  div.className = "msg " + role;
  const avatar = role === "user" ? "🙋" : "🤖";
  div.innerHTML = `<div class="avatar">${avatar}</div><div class="bubble">${contentHtml}</div>`;
  chatEl.appendChild(div);
  scrollBottom();
  return div;
}
function scrollBottom() {
  const main = document.getElementById("main");
  main.scrollTop = main.scrollHeight;
}
function showTyping() {
  const div = document.createElement("div");
  div.className = "msg bot";
  div.id = "typing";
  div.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatEl.appendChild(div);
  scrollBottom();
  return div;
}
function removeTyping() {
  const t = document.getElementById("typing");
  if (t) t.remove();
}

const SRC_STORE = [];
function sourceHtml(results) {
  if (!results || results.length === 0) return "";
  const start = SRC_STORE.length;
  results.forEach(r => SRC_STORE.push(r));
  const tags = results.map((r, i) =>
    `<span class="tag taglink" data-si="${start + i}" title="点击查看条文原文">${r.c} · ${r.s} ▾</span>`).join("");
  return `<div class="source">📎 参考来源（点击标签查看原文）：${tags}<div class="src-detail" style="display:none"></div></div>`;
}
document.addEventListener("click", e => {
  const tag = e.target.closest(".taglink");
  if (!tag) return;
  const detail = tag.closest(".source").querySelector(".src-detail");
  if (!detail) return;
  if (detail.style.display !== "none" && detail.dataset.si === tag.dataset.si) {
    detail.style.display = "none"; return;
  }
  const r = SRC_STORE[Number(tag.dataset.si)];
  if (!r) return;
  detail.dataset.si = tag.dataset.si;
  const txt = r.t.length > 600 ? r.t.slice(0, 600) + "…" : r.t;
  detail.innerHTML = "<b>条文原文（截取）：</b>\n" + escapeHtml(txt);
  detail.style.display = "block";
});

// ============ 追问建议 ============
function splitFollowups(answer) {
  const m = answer.match(/(?:【相关提问】|相关提问)[:：]\s*([\s\S]+)$/m);
  if (!m) return { body: answer, followups: [] };
  const body = answer.slice(0, m.index).trim();
  const followups = m[1].split(/[、;；\n]/)
    .map(s => s.replace(/^[\s"'“”\d.、-]+|[\s"'“”]+$/g, ""))
    .filter(s => s.length >= 5 && s.length <= 40).slice(0, 3);
  return { body, followups };
}
function addFollowups(div, followups) {
  const box = document.createElement("div");
  box.className = "followups";
  const label = document.createElement("div");
  label.className = "fu-label";
  label.textContent = "💡 你可能还想问：";
  box.appendChild(label);
  followups.forEach(fq => {
    const c = document.createElement("span");
    c.className = "chip fuchip";
    c.textContent = fq;
    c.addEventListener("click", () => ask(fq));
    box.appendChild(c);
  });
  div.querySelector(".bubble").appendChild(box);
}

// ============ 点赞/点踩反馈 ============
function addFeedback(div, fb) {
  let tools = div.querySelector(".msg-tools");
  if (!tools) {
    tools = document.createElement("div");
    tools.className = "msg-tools";
    div.querySelector(".bubble").appendChild(tools);
  }
  const mk = (txt, v) => {
    const b = document.createElement("button");
    b.className = "toolbtn fbtn";
    b.textContent = txt;
    b.addEventListener("click", () => {
      const rec = Object.assign({}, fb, { v, t: new Date().toISOString() });
      try {
        const arr = JSON.parse(localStorage.getItem("zd_fb") || "[]");
        arr.push(rec);
        localStorage.setItem("zd_fb", JSON.stringify(arr));
      } catch (e) {}
      div.querySelectorAll(".fbtn").forEach(x => { x.disabled = true; });
      b.classList.add("on");
      b.textContent = v === "up" ? "👍 感谢反馈" : "👎 已记录，我们会改进";
    });
    return b;
  };
  tools.appendChild(mk("👍 有帮助", "up"));
  tools.appendChild(mk("👎 没帮助", "down"));
}

function addTools(div, getPlain) {
  const tools = document.createElement("div");
  tools.className = "msg-tools";
  const btn = document.createElement("button");
  btn.className = "toolbtn";
  btn.textContent = "📋 复制";
  btn.addEventListener("click", () => {
    const done = ok => { btn.textContent = ok ? "✅ 已复制" : "❌ 复制失败"; btn.classList.add("copied");
      setTimeout(() => { btn.textContent = "📋 复制"; btn.classList.remove("copied"); }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(getPlain()).then(() => done(true), () => done(false));
    } else {
      try {
        const ta = document.createElement("textarea");
        ta.value = getPlain(); document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); ta.remove(); done(true);
      } catch (e) { done(false); }
    }
  });
  tools.appendChild(btn);
  div.querySelector(".bubble").appendChild(tools);
}

function exportFeedback() {
  try { return localStorage.getItem("zd_fb") || "[]"; } catch (e) { return "[]"; }
}

// ============ 问答主流程 ============
async function ask(question) {
  const q = question.trim();
  if (!q) return;
  addMsg("user", `<p>${escapeHtml(q)}</p>`);
  inputEl.value = "";
  inputEl.disabled = true; sendBtn.disabled = true;
  showTyping();

  const allHits = search(q, 10);
  const results = CURRENT_COUNTRY === "全部" ? allHits.slice(0, 5)
    : allHits.filter(r => r.c === CURRENT_COUNTRY).slice(0, 5);
  const context = results.map(r => ({ section: r.s, text: r.t }));

  let answer = null;
  let usedProxy = false;
  if (PROXY_URL) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 30000);
      const resp = await fetch(PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q, context, history: HISTORY.slice(-3) }),
        signal: ctrl.signal
      });
      clearTimeout(timer);
      if (resp.ok) {
        const data = await resp.json();
        if (data.answer) { answer = data.answer; usedProxy = true; }
      }
    } catch (e) {
      console.warn("代理调用失败，降级为检索模式", e);
    }
  }

  removeTyping();
  if (answer) {
    const parsed = parseAnswer(answer);
    let contentHtml = renderMarkdown(parsed.body);
    if (parsed.keyItems) contentHtml = keycardHtml(parsed.keyItems) + contentHtml;
    contentHtml += sourceHtml(results);
    const div = addMsg("bot", contentHtml);
    addTools(div, () => parsed.body);
    addFeedback(div, { q, mode: "ai", sources: results.map(r => r.c + "·" + r.s) });
    if (parsed.followups.length) addFollowups(div, parsed.followups);
    HISTORY.push({ q, a: answer });
    if (HISTORY.length > 6) HISTORY = HISTORY.slice(-6);
  } else {
    // 检索式降级
    let html = "";
    if (results.length > 0) {
      const scope = CURRENT_COUNTRY === "全部" ? "" : `（范围：${CURRENT_COUNTRY}）`;
      html = `<p>当前为<b>检索模式</b>${scope}，为您找到以下相关条文：</p>`;
      results.forEach(r => {
        html += `<div class="source" style="margin-top:6px"><span class="tag">${r.c} · ${r.s}</span></div>`;
        html += `<p style="font-size:14px;color:#374151">${escapeHtml(r.t.slice(0, 300))}${r.t.length > 300 ? "…" : ""}</p>`;
      });
    } else {
      const tip = CURRENT_COUNTRY === "全部" ? "请尝试换个问法，或补充国别（阿联酋/摩洛哥）与关键词。"
        : `「${CURRENT_COUNTRY}」范围内未命中，可切回「全部」再试。`;
      html = `<p>抱歉，未在指南中找到相关内容。${tip}</p>`;
    }
    const d2 = addMsg("bot", html);
    addFeedback(d2, { q, mode: "retrieve", hit: results.length > 0 });
  }
  inputEl.disabled = false; sendBtn.disabled = false;
  inputEl.focus();
}

// ============ 事件 ============
sendBtn.addEventListener("click", () => ask(inputEl.value));
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(inputEl.value); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
});
document.getElementById("chips").addEventListener("click", e => {
  if (e.target.classList.contains("chip")) ask(e.target.textContent);
});
</script>
